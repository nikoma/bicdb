[package]
name = "bicdb-app-runtime"
version = "1.0.570"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Capability-mediated application runtime of the BicDB database. Part of BicDB, one database for SQL (PostgreSQL protocol), a Redis-compatible cache, search and vectors; install `bicdb`"
readme = "README.md"
keywords = ["bicdb", "database"]
categories = ["database-implementations"]
# Build inputs only: test suites, fixtures and examples stay in the repository.
include = ["/README.md", "/src/**", "/Cargo.toml", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md"]

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
axum.workspace = true
axum-server.workspace = true
bytes.workspace = true
bicdb-core = { path = "../bicdb-core", version = "=1.0.570" }
bicdb-lua = { path = "../bicdb-lua", version = "=1.0.570" }
bicdb-script = { path = "../bicdb-script", version = "=1.0.570" }
bicdb-workflow = { path = "../bicdb-workflow", version = "=1.0.570" }
bicdb-extension = { path = "../bicdb-extension", version = "=1.0.570", features = ["http"] }
bicdb-sql = { path = "../bicdb-sql", version = "=1.0.570", default-features = false }
chacha20poly1305.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
cron.workspace = true
ed25519-dalek.workspace = true
subtle.workspace = true
geo.workspace = true
handlebars.workspace = true
hex.workspace = true
hmac.workspace = true
http-body.workspace = true
http-body-util.workspace = true
libc.workspace = true
mime_guess.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
parking_lot.workspace = true
phonenumber.workspace = true
reqwest.workspace = true
regex.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rust_decimal = { version = "1.43", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
sha1.workspace = true
sqlparser.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
wat = "1"
