[package]
name = "bicdb-blob-s3"
version = "1.0.613"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S3-compatible blob provider for the BicDB application host. Part of BicDB, one database for SQL (PostgreSQL protocol), a Redis-compatible cache, search and vectors; install `bicdb`"
readme = "README.md"
keywords = ["bicdb", "database"]
categories = ["database-implementations"]
# Build inputs only: test suites, fixtures and examples stay in the repository.
include = ["/README.md", "/src/**", "/Cargo.toml", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md"]

[dependencies]
base64.workspace = true
bicdb-app-runtime = { path = "../bicdb-app-runtime", version = "=1.0.613" }
bicdb-extension = { path = "../bicdb-extension", version = "=1.0.613" }
chrono.workspace = true
hmac.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
