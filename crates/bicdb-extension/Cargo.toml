[package]
name = "bicdb-extension"
version = "1.0.438-beta"
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "Versioned extension ABI, author SDK, and sandboxed host runtime for BicDB"

[features]
default = ["host"]
host = ["dep:sha2", "dep:wasmtime"]
http = ["host", "dep:axum", "dep:tokio"]

[dependencies]
axum = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
thiserror.workspace = true
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
wasmtime = { version = "46.0.1", optional = true }

[dev-dependencies]
tempfile.workspace = true
wat = "1"
