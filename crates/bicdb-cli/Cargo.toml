[package]
name = "bicdb"
version = "1.0.548"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "One database for SQL over the PostgreSQL wire protocol, a Redis-compatible cache, full-text, vector and geospatial search, time travel and live queries"
documentation = "https://github.com/nikoma/bicdb/tree/main/docs"
readme = "README.md"
keywords = ["database", "postgres", "redis", "sql", "search"]
categories = ["database-implementations", "command-line-utilities"]
# Build inputs only: integration tests stay in the repository.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md"]

[[bin]]
name = "bicdb"
path = "src/main.rs"

[features]
default = []
# Benchmark and PostgreSQL compatibility harnesses are developer tooling.
bench = ["dep:bicdb-bench"]
# External comparison engines remain public developer tooling, but are not
# linked into the production CLI unless explicitly requested.
bench-comparison-engines = ["bench", "bicdb-bench/comparison-engines"]

[dependencies]
uuid.workspace = true
anyhow.workspace = true
bicdb-analytics = { path = "../bicdb-analytics", version = "=1.0.548" }
base64.workspace = true
bicdb-app-runtime = { path = "../bicdb-app-runtime", version = "=1.0.548" }
bicdb-blob-s3 = { path = "../bicdb-blob-s3", version = "=1.0.548" }
bicdb-bench = { path = "../bicdb-bench", version = "=1.0.548", optional = true }
bicdb-cell = { path = "../bicdb-cell", version = "=1.0.548" }
bicdb-core = { path = "../bicdb-core", version = "=1.0.548" }
bicdb-pgwire = { path = "../bicdb-pgwire", version = "=1.0.548" }
bicdb-page = { path = "../bicdb-page", version = "=1.0.548" }
runtime-redis-provider = { package = "bicdb-provider-redis", path = "../bicdb-provider-redis", version = "=1.0.548" }
runtime-email-provider = { package = "bicdb-provider-email", path = "../bicdb-provider-email", version = "=1.0.548" }
runtime-grpc-provider = { package = "bicdb-provider-grpc", path = "../bicdb-provider-grpc", version = "=1.0.548" }
runtime-tokenizer-provider = { package = "bicdb-provider-tokenizer", path = "../bicdb-provider-tokenizer", version = "=1.0.548" }
runtime-embeddings-provider = { package = "bicdb-provider-embeddings", path = "../bicdb-provider-embeddings", version = "=1.0.548" }
runtime-llm-provider = { package = "bicdb-provider-llm", path = "../bicdb-provider-llm", version = "=1.0.548" }
bicdb-resp = { path = "../bicdb-resp", version = "=1.0.548" }
bicdb-sql = { path = "../bicdb-sql", version = "=1.0.548" }
bicdb-sync = { path = "../bicdb-sync", version = "=1.0.548" }
clap.workspace = true
ctrlc.workspace = true
crossterm.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
libc.workspace = true
mimalloc = "0.1"
parking_lot.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-postgres = "0.7.18"
toml = "0.9.12"
rustls.workspace = true
rustls-pemfile.workspace = true
rustls-native-certs = "0.8"
tokio-postgres-rustls = "0.14"

[dev-dependencies]
rcgen = "0.13"
osmpbfreader.workspace = true
protobuf.workspace = true
tempfile.workspace = true

[[test]]
name = "paged_recovery_cli"
path = "tests/paged_recovery_cli.rs"
required-features = ["bench"]
