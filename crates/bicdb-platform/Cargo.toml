[package]
name = "bicdb-platform"
version = "1.0.438-beta"
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
description = "Durable application deployment and execution for BicDB"

[[bin]]
name = "bic"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bicdb-core = { path = "../bicdb-core", version = "1.0.438-beta" }
bicdb-sql = { path = "../bicdb-sql", version = "1.0.438-beta", default-features = false }
clap.workspace = true
libc.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlparser.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["signal", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
