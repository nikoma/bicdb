[package]
name = "bicdb-provider-llm"
version = "1.0.623"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Structured LLM provider for the BicDB application host. Part of BicDB, one database for SQL (PostgreSQL protocol), a Redis-compatible cache, search and vectors; install `bicdb`"
readme = "README.md"
keywords = ["bicdb", "database"]
categories = ["database-implementations"]
# Build inputs only: test suites, fixtures and examples stay in the repository.
include = ["/README.md", "/src/**", "/Cargo.toml", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md"]

[dependencies]
bicdb-app-runtime = { path = "../bicdb-app-runtime", version = "=1.0.623" }
bicdb-extension = { path = "../bicdb-extension", version = "=1.0.623" }
reqwest.workspace = true
serde_json.workspace = true
url.workspace = true
