url = "2.5"
wide = "0.7.33"
wkt = "0.14"
zstd = "0.13"
zeroize = { version = "1.9", features = ["derive"] }

x509-parser = { version = "0.18.1", default-features = false }

# Cluster and recovery tests are CPU-bound in third-party code (signatures,
# hashing, TLS records, certificate parsing, JSON): unoptimized, it dominates
# every authenticated RPC and every re-validation. Optimize the third-party
# dependency closure of bicdb-core in dev/test builds. The list is explicit
# rather than "*": optimizing all ~1000 workspace dependencies makes a cold
# single-job workspace build exceed its CI time limit. Regenerate from
# `cargo tree -p bicdb-core -e normal,dev --prefix none --format "{p}"`
# (without proc-macros; version-qualified only where several versions exist).
