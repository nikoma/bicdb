name: tests

# The reason this exists: three separate defects shipped in a single week
# because nothing ran the test suite on a pull request. One of them was a
# crate that did not compile. Reviewing diffs is not a substitute for
# building them.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_filter:
        description: 'Optional Core library substring for focused manual validation; empty selectors run every suite'
        type: string
        required: false
        default: ''
      pgwire_filter:
        description: 'Optional PGwire library substring; mutually exclusive with other selectors'
        type: string
        required: false
        default: ''
      cli_target:
        description: 'Optional CLI integration-test target for manual validation; requires empty core_filter'
        type: string
        required: false
        default: ''
      cli_failure_db_custody:
        description: 'Opt in to bounded stopped native metadata CLI DB roots on failure; never TLS or quarantine uploads'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # GitHub's hosted runner has limited disk and memory. Eight simultaneous
  # static links have produced SIGBUS failures, and building every workspace
  # example before every matrix suite has exhausted the runner's disk.
  # One linker at a time, no incremental object cache, and no debug symbols in
  # CI keeps the complete suite below the runner's hard memory/disk ceilings.
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_TEST_THREADS: "4"

jobs:
  validate-selectors:
    name: Validate focused test selectors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CORE_FILTER: ${{ inputs.core_filter }}
      PGWIRE_FILTER: ${{ inputs.pgwire_filter }}
      CLI_TARGET: ${{ inputs.cli_target }}
      CLI_DB_CUSTODY: ${{ inputs.cli_failure_db_custody }}
    steps:
      - name: Reject incompatible or malformed selectors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os, re
          values = {name: os.environ.get(name, '') for name in ('CORE_FILTER', 'PGWIRE_FILTER', 'CLI_TARGET')}
          selected = [name for name, value in values.items() if value]
          if len(selected) > 1:
              raise SystemExit('Select at most one of core_filter, pgwire_filter and cli_target')
          for name, value in values.items():
              if value and (value.startswith('-') or len(value) > 512 or any(ord(c) < 32 or ord(c) == 127 for c in value)):
                  raise SystemExit(f'{name} must be a bounded single-line substring, not an option')
          if values['CLI_TARGET'] and not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_-]{0,127}', values['CLI_TARGET']):
              raise SystemExit('CLI_TARGET must be a bounded Cargo integration-target name')
          if os.environ.get('CLI_DB_CUSTODY') == 'true' and values['CLI_TARGET'] != 'native_metadata_operator_cli':
              raise SystemExit('DB custody requires explicit manual native_metadata_operator_cli target')
          print('Selected: ' + (selected[0] if selected else 'all broad suites'))
          PYCODE

  architecture:
    name: Public repository has no private dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install boundary scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Enforce open-core dependency direction
        run: ./scripts/check-open-core-boundary.sh

  build:
    name: Community-only workspace compiles, tests included
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --all-targets is the point: `cargo build` alone would not have caught
      # bicdb-sql's unit tests failing to compile against a changed signature.
      - name: cargo check --workspace --all-targets
        run: python3 scripts/qualification/guard-build-memory.py --log "$RUNNER_TEMP/native-workspace-pressure/alltargets.jsonl" -- cargo check --workspace --all-targets --locked
      # Workspace feature unification enables TLS in Core. Check this actual
      # consumer separately so TLS-only APIs cannot leak into its Core build.
      - name: Workflow consumer compiles without Core defaults
        run: python3 scripts/qualification/guard-build-memory.py --log "$RUNNER_TEMP/native-workspace-pressure/consumer.jsonl" -- cargo check -p bicdb-workflow --all-targets --locked
      - name: Retain qualification build pressure and interruption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-workspace-pressure-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: ${{ runner.temp }}/native-workspace-pressure/

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  licensing:
    name: Licensing invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: scripts/validate-licensing.sh
        run: ./scripts/validate-licensing.sh

  test:
    needs: validate-selectors
    if: github.event_name != 'workflow_dispatch' || (inputs.core_filter == '' && inputs.cli_target == '' && inputs.pgwire_filter == '')
    name: ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Message brokers for the connector tests (crates/bicdb-pgwire/tests/
    # connectors.rs). Without these variables those tests skip themselves.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3-alpine
        env:
          RABBITMQ_DEFAULT_USER: bicdb
          RABBITMQ_DEFAULT_PASS: bicdb-ci
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    env:
      BICDB_TEST_REDIS_URL: redis://127.0.0.1:6379
      BICDB_TEST_AMQP_URL: amqp://bicdb:bicdb-ci@127.0.0.1:5672/%2f
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: bicdb-core
            args: -p bicdb-core
          # Multi-node native fixtures start three to five TLS nodes each and
          # assert the product's real-time protocol budgets. Four of them at
          # once on one runner measure runner contention, not the protocol,
          # so they run one at a time in their own job. Nothing is skipped:
          # this job and the parallel job together cover every Core test.
          - name: bicdb-core native multi-node (serial)
            args: -p bicdb-core --lib
          - name: bicdb-sql
            args: -p bicdb-sql
          - name: bicdb-pgwire
            args: -p bicdb-pgwire
          - name: rest of workspace
            args: >-
              --workspace
              --exclude bicdb-core
              --exclude bicdb-sql
              --exclude bicdb-pgwire
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test-target scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: actions/setup-node@v4
        if: matrix.suite.name == 'rest of workspace'
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      # bicdb-core's projection chaos test deliberately refuses to run unless
      # its out-of-process crash helper exists. No other suite needs the full
      # workspace's examples, so build exactly that helper in the core job.
      - name: Build projection chaos helper
        if: startsWith(matrix.suite.name, 'bicdb-core')
        run: cargo build --config 'profile.dev.package."*".opt-level=2' -p bicdb-core --example chaos_child --locked
      - name: cargo test ${{ matrix.suite.args }}
        if: matrix.suite.name == 'bicdb-pgwire'
        run: cargo test ${{ matrix.suite.args }} --locked -- --test-threads=4
      - name: cargo test bicdb-core without the serial native multi-node fixtures
        if: matrix.suite.name == 'bicdb-core'
        run: >-
          cargo test --config 'profile.dev.package."*".opt-level=2' ${{ matrix.suite.args }} --locked -- --test-threads=4
          --skip distribution_native_host::
          --skip range_image_native::rf3_fixture::
      - name: cargo test bicdb-core native multi-node fixtures one at a time
        if: matrix.suite.name == 'bicdb-core native multi-node (serial)'
        run: >-
          cargo test --config 'profile.dev.package."*".opt-level=2' ${{ matrix.suite.args }} --locked --
          distribution_native_host:: range_image_native::rf3_fixture::
          --test-threads=1
      - name: cargo test bicdb-sql with bounded linked artifacts
        if: matrix.suite.name == 'bicdb-sql'
        run: ./scripts/run-cargo-test-targets-bounded.sh bicdb-sql
      - name: cargo test remaining workspace with bounded linked artifacts
        if: matrix.suite.name == 'rest of workspace'
        run: >-
          python3 scripts/platform/run_workspace_tests_bounded.py
          --exclude bicdb-core --exclude bicdb-sql --exclude bicdb-pgwire
      - name: Cluster harness and offline queue contracts
        if: matrix.suite.name == 'rest of workspace'
        run: |
          python3 -m unittest discover -s scripts/platform -p 'test_*.py'
          python3 -m unittest discover -s examples/oracle/hr -p 'test_*.py'
          python3 -m unittest discover -s examples/oracle/reference -p 'test_*.py'
          python3 examples/oracle/hr/prepare.py --check
          node --test examples/platform/notebook/*.test.mjs

  focused-core:
    needs: validate-selectors
    name: Focused Core library (${{ inputs.core_filter }})
    if: github.event_name == 'workflow_dispatch' && inputs.core_filter != '' && inputs.cli_target == '' && inputs.pgwire_filter == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BICDB_CORE_TEST_FILTER: ${{ inputs.core_filter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record unused helper omission for exact component cohort
        run: |
          mkdir -p "$RUNNER_TEMP/native-core-evidence"
          printf '%s\n' '{"chaos_child":"NOT BUILT","scope":"exact24 S2 and separate noTLS1; unused by these fixtures; actual dependency failure must remain a failure"}' > "$RUNNER_TEMP/native-core-evidence/helper-not-built.json"
      - name: Record source and list selected Core library tests
        shell: bash
        run: |
          set -euo pipefail
          case "$BICDB_CORE_TEST_FILTER" in
            -*) echo 'A test substring cannot begin with an option prefix' >&2; exit 2 ;;
          esac
          mkdir -p "$RUNNER_TEMP/native-core-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/native-core-evidence/source-revision.txt"
          rustc --version --verbose > "$RUNNER_TEMP/native-core-evidence/rustc.txt"
          python3 scripts/qualification/guard-build-memory.py --log "$RUNNER_TEMP/native-core-evidence/list-pressure.jsonl" -- \
            cargo test --config 'profile.dev.package."*".opt-level=2' -p bicdb-core --lib --locked "$BICDB_CORE_TEST_FILTER" -- --list \
            2>&1 | tee "$RUNNER_TEMP/native-core-evidence/selected-tests.log"
          python3 scripts/qualification/guard-build-memory.py --log "$RUNNER_TEMP/native-core-evidence/all-native-list-pressure.jsonl" -- \
            cargo test --config 'profile.dev.package."*".opt-level=2' -p bicdb-core --lib --locked native_registered_fifth_ -- --list \
            2>&1 | tee "$RUNNER_TEMP/native-core-evidence/all-native-tests.log"
          python3 - <<'PY'
          import os, pathlib, json
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-core-evidence'
          expected_selected = ['distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::callback_liveness_tests::native_registered_fifth_source_export_retirement_actual_callback_cancel_at_final_detach', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::callback_liveness_tests::native_registered_fifth_source_export_retirement_actual_callback_expiry_at_final_detach', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::native_registered_fifth_source_export_retirement_actual_local_term_change_at_final_detach_refuses', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::native_registered_fifth_source_export_retirement_actual_lost_retire_reply_same_terminal_custody', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::native_registered_fifth_source_export_retirement_actual_lost_start_reply_original_two_second_request', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::native_registered_fifth_source_export_retirement_actual_original_own_expires_at_final_detach', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::native_registered_fifth_source_export_retirement_actual_original_source_process_cancel_refuses', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::native_registered_fifth_source_export_retirement_actual_original_source_process_canceled_at_final_detach', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::native_registered_fifth_source_export_retirement_actual_target_store_aba_refuses_before_drop', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::native_registered_fifth_source_export_retirement_actual_two_mtls_hops_nonleader_donor', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::native_registered_fifth_source_export_retirement_actual_unknown_native_base_has_no_new_owner', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::native_registered_fifth_source_export_retirement_actual_wrong_a_refuses_before_drop', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::native_registered_fifth_source_export_retirement_actual_wrong_actor_refuses_before_drop', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::native_registered_fifth_source_export_retirement_actual_wrong_manifest_refuses_before_drop', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::native_registered_fifth_source_export_retirement_actual_wrong_native_birth_refuses_before_drop', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::remote_new_tests::native_registered_fifth_remote_new_actual_cancel_after_take_retains_exact_progress', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::remote_new_tests::native_registered_fifth_remote_new_actual_cancel_before_take_same_phase_fresh_retry', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::remote_new_tests::native_registered_fifth_remote_new_actual_changed_valid_quorum_cannot_replace_intent', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::remote_new_tests::native_registered_fifth_remote_new_actual_materialization_independent_fetch_all_pin_owners', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::remote_new_tests::native_registered_fifth_remote_new_actual_wrong_fact_digest_refuses_before_pin_take', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::remote_new_tests::remote_decision_tests::native_registered_fifth_remote_decision_actual_commit_sync_unknown_never_replaces_xid', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::remote_new_tests::remote_decision_tests::native_registered_fifth_remote_decision_actual_donor_provenance_and_native_target_record', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::remote_new_tests::remote_decision_tests::native_registered_fifth_remote_decision_actual_postcommit_cancel_reconciles_same_xid', 'distribution_native_host::provisional_listener::tests::learner_enrollment_tests::promotion_tests::registered_image_baseline::remote_source_tests::source_export_retirement_tests::remote_new_tests::remote_decision_tests::native_registered_fifth_remote_decision_actual_preput_abort_retains_original_attempt']
          def listed(path):
              return sorted(line[:-6] for line in path.read_text().splitlines() if line.endswith(': test'))
          actual_selected = listed(root / 'selected-tests.log')
          actual_all = listed(root / 'all-native-tests.log')
          if os.environ['BICDB_CORE_TEST_FILTER'] != 'source_export_retirement_tests::':
              raise SystemExit('S2 qualification permits ONLY the selected source-export module')
          if actual_selected != expected_selected or len(actual_selected) != 24:
              raise SystemExit('S2 qualification must select EXACT24 full names: original15 + NEW5 + DECISION4')
          if not set(actual_selected).issubset(actual_all):
              raise SystemExit('Selected24 missing from compiled full-family inventory')
          (root / 'inventory-verification.json').write_text(json.dumps({'selected_exact':True,'selected_count':len(actual_selected),'all_native_count_reported_not_assumed':True,'all_native_count':len(actual_all),'selected_names':actual_selected,'all_native_names':actual_all,'runtime_execution_not_yet_started':True}, indent=2)+'\n')
          print(f'Selected EXACT24 S2 cases; compiled full family actual count={len(actual_all)}; execute ONLY24 serially')
          PY
      - name: Execute selected Core native library tests serially
        shell: bash
        run: |
          set -euo pipefail
          export BICDB_TEST_EVIDENCE_ROOT="$RUNNER_TEMP/native-core-evidence/fault-state"
          export BICDB_TEST_SOURCE_SHA="$GITHUB_SHA"
          mkdir -p "$BICDB_TEST_EVIDENCE_ROOT"
          cargo test --config 'profile.dev.package."*".opt-level=2' -p bicdb-core --lib --locked "$BICDB_CORE_TEST_FILTER" -- --test-threads=1 --show-output \
            2>&1 | tee "$RUNNER_TEMP/native-core-evidence/tests.log"
      - name: Retain focused source, log and opted-in fault-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-core-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn
          path: ${{ runner.temp }}/native-core-evidence/

  focused-no-tls-decision-reader:
    needs: validate-selectors
    if: github.event_name == 'workflow_dispatch' && inputs.core_filter == 'source_export_retirement_tests::'
    name: Focused actual decision reader without TLS (one unit)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record source and list exact no-TLS actual reader unit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-no-tls-reader-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/native-no-tls-reader-evidence/source-revision.txt"
          rustc --version --verbose > "$RUNNER_TEMP/native-no-tls-reader-evidence/rustc.txt"
          printf '%s\n' '{"chaos_child":"NOT BUILT","scope":"unused by this native-origin reader unit"}' > "$RUNNER_TEMP/native-no-tls-reader-evidence/helper-not-built.json"
          python3 scripts/qualification/guard-build-memory.py --log "$RUNNER_TEMP/native-no-tls-reader-evidence/list-pressure.jsonl" -- \
            cargo test --config 'profile.dev.package."*".opt-level=2' -p bicdb-core --no-default-features --lib --locked native_remote_decision_current_reader_without_tls_refuses_required_profile_before_lookup -- --list \
            2>&1 | tee "$RUNNER_TEMP/native-no-tls-reader-evidence/selected-tests.log"
          python3 - <<'PYCODE'
          import pathlib, os, json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-no-tls-reader-evidence'
          names=sorted(line[:-6] for line in (root/'selected-tests.log').read_text().splitlines() if line.endswith(': test'))
          expected=['db::range_image_native::serving_configuration::joint_handoff::decision::unsupported_remote_reader_tests::native_remote_decision_current_reader_without_tls_refuses_required_profile_before_lookup']
          (root/'inventory-verification.json').write_text(json.dumps({'selected':names,'expected':expected,'no_tls':True,'not_yet_executed':True},indent=2)+'\n')
          if names!=expected: raise SystemExit('no-TLS actual reader must list exactly the one approved full name')
          PYCODE
      - name: Execute exact no-TLS actual reader unit serially
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qualification/guard-build-memory.py --log "$RUNNER_TEMP/native-no-tls-reader-evidence/runtime-pressure.jsonl" -- \
            cargo test --config 'profile.dev.package."*".opt-level=2' -p bicdb-core --no-default-features --lib --locked native_remote_decision_current_reader_without_tls_refuses_required_profile_before_lookup -- --test-threads=1 --show-output \
            2>&1 | tee "$RUNNER_TEMP/native-no-tls-reader-evidence/tests.log"
      - name: Retain no-TLS actual reader source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-no-tls-reader-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: ${{ runner.temp }}/native-no-tls-reader-evidence/

  focused-cli:
    needs: validate-selectors
    name: Focused CLI integration (${{ inputs.cli_target }})
    if: github.event_name == 'workflow_dispatch' && inputs.cli_target != '' && inputs.core_filter == '' && inputs.pgwire_filter == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BICDB_CLI_TEST_TARGET: ${{ inputs.cli_target }}
      BICDB_CAPTURE_CLI_DB_FAILURE: ${{ inputs.cli_failure_db_custody }}
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record exact source and list CLI integration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-cli-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/native-cli-evidence/source-revision.txt"
          git show --no-patch --format=fuller HEAD > "$RUNNER_TEMP/native-cli-evidence/source-commit.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/native-cli-evidence/tracked-source.tar.gz" HEAD
          rustc --version --verbose > "$RUNNER_TEMP/native-cli-evidence/rustc.txt"
          if [[ ! "$BICDB_CLI_TEST_TARGET" =~ ^[A-Za-z0-9_][A-Za-z0-9_-]{0,127}$ ]]; then
            echo 'CLI target must be a bounded Cargo integration-target name, not an option/path' >&2
            exit 2
          fi
          printf '%s\n' "$BICDB_CLI_TEST_TARGET" > "$RUNNER_TEMP/native-cli-evidence/cli-target.txt"
          cargo test -p bicdb-cli --test "$BICDB_CLI_TEST_TARGET" --locked -- --list \
            2>&1 | tee "$RUNNER_TEMP/native-cli-evidence/selected-tests.log"
          python3 - <<'PYCODE'
          import os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-cli-evidence' / 'selected-tests.log'
          count = sum(line.endswith(': test') for line in path.read_text().splitlines())
          if count == 0:
              raise SystemExit('The requested CLI integration target selected no tests')
          print(f'Selected {count} CLI integration tests; actual execution remains required')
          PYCODE
      - name: Execute CLI integration target serially
        shell: bash
        run: |
          set -euo pipefail
          # No BICDB_TEST_EVIDENCE_ROOT: generated TLS/DB fixture directories
          # stay private and are deliberately outside this uploaded subtree.
          export BICDB_TEST_CLI_EVIDENCE_ROOT="$RUNNER_TEMP/native-cli-evidence/failure-diagnostics"
          export BICDB_TEST_CLI_RPC_EVIDENCE_ROOT="$RUNNER_TEMP/native-cli-evidence/rpc-journals"
          if [[ "$BICDB_CAPTURE_CLI_DB_FAILURE" == 'true' ]]; then
            export BICDB_TEST_CLI_DB_EVIDENCE_ROOT="$RUNNER_TEMP/native-cli-db-custody"
            mkdir -p "$BICDB_TEST_CLI_DB_EVIDENCE_ROOT"
          fi
          export BICDB_TEST_SOURCE_SHA="$GITHUB_SHA"
          cargo test -p bicdb-cli --test "$BICDB_CLI_TEST_TARGET" --locked -- --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/native-cli-evidence/tests.log"
          python3 - <<'PYCODE'
          import os, pathlib, re
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-cli-evidence' / 'tests.log'
          results = re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed;', path.read_text())
          if sum(int(passed) + int(failed) for passed, failed in results) == 0:
              raise SystemExit('CLI target ran no non-ignored tests')
          PYCODE
      - name: Retain exact tracked source and full CLI logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-cli-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn
          path: ${{ runner.temp }}/native-cli-evidence/

      - name: Retain explicitly opted-in stopped native databases only
        if: always() && inputs.cli_failure_db_custody
        uses: actions/upload-artifact@v4
        with:
          name: native-cli-stopped-databases-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn
          # Exact subtree only. Private .native-cli-db-quarantine siblings and
          # generated fixture TLS roots are deliberately OUTSIDE this path.
          path: ${{ runner.temp }}/native-cli-db-custody/

  focused-pgwire:
    name: Focused PGwire library (${{ inputs.pgwire_filter }})
    needs: validate-selectors
    if: github.event_name == 'workflow_dispatch' && inputs.pgwire_filter != '' && inputs.core_filter == '' && inputs.cli_target == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BICDB_PGWIRE_TEST_FILTER: ${{ inputs.pgwire_filter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record exact source and list selected PGwire library tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgwire-library-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/pgwire-library-evidence/source-revision.txt"
          git show --no-patch --format=fuller HEAD > "$RUNNER_TEMP/pgwire-library-evidence/source-commit.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/pgwire-library-evidence/tracked-source.tar.gz" HEAD
          rustc --version --verbose > "$RUNNER_TEMP/pgwire-library-evidence/rustc.txt"
          printf '%s\n' "$BICDB_PGWIRE_TEST_FILTER" > "$RUNNER_TEMP/pgwire-library-evidence/test-filter.txt"
          cargo test -p bicdb-pgwire --lib --locked "$BICDB_PGWIRE_TEST_FILTER" -- --list \
            2>&1 | tee "$RUNNER_TEMP/pgwire-library-evidence/selected-tests.log"
          python3 - <<'PYCODE'
          import os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pgwire-library-evidence' / 'selected-tests.log'
          count = sum(line.endswith(': test') for line in path.read_text().splitlines())
          if count == 0:
              raise SystemExit('The requested PGwire filter selected no tests')
          print(f'Selected {count} PGwire library tests; actual execution remains required')
          PYCODE
      - name: Execute selected PGwire library tests
        shell: bash
        run: |
          set -euo pipefail
          export BICDB_TEST_SOURCE_SHA="$GITHUB_SHA"
          cargo test -p bicdb-pgwire --lib --locked "$BICDB_PGWIRE_TEST_FILTER" -- --test-threads=4 --show-output \
            2>&1 | tee "$RUNNER_TEMP/pgwire-library-evidence/tests.log"
          python3 - <<'PYCODE'
          import os, pathlib, re
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pgwire-library-evidence' / 'tests.log'
          results = re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed;', path.read_text())
          if sum(int(passed) + int(failed) for passed, failed in results) == 0:
              raise SystemExit('PGwire filter ran no non-ignored tests')
          PYCODE
      - name: Retain exact source and full PGwire library logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-pgwire-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn
          path: ${{ runner.temp }}/pgwire-library-evidence/
