[package]
name = "bicdb-analytics"
version = "1.0.524"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Arrow export and DataFusion queries over BicDB collections (internal crate; install `bicdb`)"
categories = ["database-implementations"]
# Build inputs only: test suites, fixtures and examples stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md"]

[features]
default = ["analytics"]
analytics = []

[dependencies]
arrow.workspace = true
bicdb-core = { path = "../bicdb-core", version = "=1.0.524" }
datafusion.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
