[package]
name = "bicdb-app-host"
version = "1.0.673"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Not part of the published `bicdb` crate set.
publish = false
description = "Durable application deployment and execution for BicDB"

[[bin]]
name = "bic"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bicdb-core = { path = "../bicdb-core", version = "=1.0.673" }
bicdb-pgwire = { path = "../bicdb-pgwire", version = "=1.0.673", default-features = false }
bicdb-sql = { path = "../bicdb-sql", version = "=1.0.673", default-features = false }
clap.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlparser.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["signal", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-postgres = "0.7.18"
