[package]
name = "bicdb-provider-grpc"
version = "1.0.524"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Unary gRPC provider for the BicDB application host (internal crate; install `bicdb`)"
categories = ["database-implementations"]
# Build inputs only: test suites, fixtures and examples stay in the repository.
include = ["/src/**", "/build.rs", "/proto/**", "/Cargo.toml", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md"]

[dependencies]
bicdb-app-runtime = { path = "../bicdb-app-runtime", version = "=1.0.524" }
bicdb-extension = { path = "../bicdb-extension", version = "=1.0.524" }
bytes.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true
url.workspace = true

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
prost = "0.13"
tokio-stream = { workspace = true, features = ["net"] }
