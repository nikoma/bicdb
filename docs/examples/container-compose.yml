# Copy bicdb.toml to bicdb-container.toml beside this file before starting.
# General pgwire server: databases share one process and failure domain.
# Database separation is not a Cell boundary. Hard Cell isolation requires one
# bicdb-cell runtime per process with dedicated mounts, uid, network policy and
# cgroup limits; confidential deployments also require verified VM attestation.
services:
  bicdb:
    # Supply an independently verified image pinned by digest.
    image: "${BICDB_IMAGE:?set a verified image digest}"
    command: ["serve", "--config", "/etc/bicdb/bicdb.toml"]
    stop_grace_period: 45s
    environment:
      BICDB_SERVER_PATH: /data/database
      BICDB_SERVER_TLS_CERT: /run/secrets/bicdb_tls_cert
      BICDB_SERVER_TLS_KEY: /run/secrets/bicdb_tls_key
      BICDB_SERVER_SLOW_QUERY_LOG: /logs/slow-query.jsonl
    ports:
      - "5433:5433"
    volumes:
      - ./bicdb-container.toml:/etc/bicdb/bicdb.toml:ro
      - bicdb-data:/data
      - bicdb-logs:/logs
    secrets:
      - bicdb_tls_cert
      - bicdb_tls_key
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  bicdb-data:
  bicdb-logs:

secrets:
  bicdb_tls_cert:
    file: ./secrets/server.pem
  bicdb_tls_key:
    file: ./secrets/server-key.pem
