default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("BICDB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("BICDB_PORT", "5433") %>
  username: <%= ENV.fetch("BICDB_USER", "bicdb") %>
  password: <%= ENV["BICDB_PASSWORD"] %>
  sslmode: <%= ENV.fetch("BICDB_SSLMODE", "disable") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", "5") %>

<% %w[development test production].each do |environment| %>
<%= environment %>:
  primary:
    <<: *default
    database: <%= ENV.fetch("TEAM_BOARD_DB_PREFIX", "team_board") %>_<%= environment %>
  queue:
    <<: *default
    database: <%= ENV.fetch("TEAM_BOARD_DB_PREFIX", "team_board") %>_<%= environment %>_queue
    migrations_paths: db/queue_migrate
  cache:
    <<: *default
    database: <%= ENV.fetch("TEAM_BOARD_DB_PREFIX", "team_board") %>_<%= environment %>_cache
    migrations_paths: db/cache_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("TEAM_BOARD_DB_PREFIX", "team_board") %>_<%= environment %>_cable
    migrations_paths: db/cable_migrate
<% end %>
