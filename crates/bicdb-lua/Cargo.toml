[package]
name = "bicdb-lua"
version = "1.0.524"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bounded Lua 5.1 execution for the BicDB database (internal crate; install `bicdb`)"
categories = ["database-implementations"]
# Build inputs only: test suites, fixtures and examples stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md"]

[dependencies]
mlua = { version = "0.11", features = ["lua51", "vendored", "serialize"] }
serde_json.workspace = true
thiserror.workspace = true
