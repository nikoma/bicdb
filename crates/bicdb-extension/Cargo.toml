[package]
name = "bicdb-extension"
version = "1.0.664"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Versioned extension ABI, author SDK and sandboxed host runtime for BicDB. Part of BicDB, one database for SQL (PostgreSQL protocol), a Redis-compatible cache, search and vectors; install `bicdb`"
readme = "README.md"
keywords = ["bicdb", "database"]
categories = ["database-implementations"]
# Build inputs only: test suites, fixtures and examples stay in the repository.
include = ["/README.md", "/src/**", "/Cargo.toml", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md"]

[features]
default = ["host"]
host = ["dep:sha2", "dep:wasmtime"]
http = ["host", "dep:axum", "dep:tokio"]

[dependencies]
axum = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
thiserror.workspace = true
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
wasmtime = { version = "48.0.3", optional = true }

[dev-dependencies]
tempfile.workspace = true
wat = "1"
