bicdb-extension = { path = "../bicdb-extension", version = "1.0.438-beta", features = ["http"] }
bicdb-sql = { path = "../bicdb-sql", version = "1.0.438-beta", default-features = false }
chacha20poly1305.workspace = true
chrono.workspace = true
