[package]
name = "bicdb-page"
version = "1.0.640"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Page store, page WAL and buffer pool of the BicDB database. Part of BicDB, one database for SQL (PostgreSQL protocol), a Redis-compatible cache, search and vectors; install `bicdb`"
readme = "README.md"
keywords = ["bicdb", "database"]
categories = ["database-implementations"]
# Build inputs only: test suites, fixtures and examples stay in the repository.
include = ["/README.md", "/src/**", "/Cargo.toml", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md"]

# Phase 1 of docs/server-paged-storage-todo.md: the first-party page file and
# buffer pool underneath `storage_mode = server_paged`.
#
# Deliberately has NO dependency on bicdb-core. The page store is testable,
# benchmarkable, and licence-auditable on its own, and keeping the edge
# one-directional stops record semantics leaking into the storage layer.

[dependencies]
crc32fast.workspace = true
# `flock` for exclusive store-directory ownership; see src/lock.rs for why an OS
# lock rather than a lock file is the only crash-safe option.
libc.workspace = true
hex.workspace = true
parking_lot.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
flate2 = "1.1.9"
tempfile.workspace = true

# Writer process for tests/kill_recovery.rs. A dedicated binary rather than a
# re-exec of the test harness, which would spawn a process per test recursively.
[[bin]]
name = "kill-writer"
path = "src/bin/kill-writer.rs"
