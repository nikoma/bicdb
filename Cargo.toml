subtle = "2.6"
unicode_categories = "0.1"
unicode-normalization = "0.1.25"
tempfile = "3.12"
thiserror = "2.0"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.42", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.12.3", features = ["transport", "tls-webpki-roots"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
url = "2.5"
wide = "0.7.33"
wkt = "0.14"
zstd = "0.13"
zeroize = { version = "1.9", features = ["derive"] }

x509-parser = { version = "0.18.1", default-features = false }

# Cluster and recovery tests are CPU-bound in a few third-party crates
# (signatures, hashing, AEAD/TLS records, JSON, compression): unoptimized,
# they dominate every authenticated RPC and every re-validation. Optimize
# exactly those in dev/test builds. The list is explicit rather than "*":
# optimizing all ~1000 workspace dependencies makes a cold single-job
# workspace build exceed its CI time limit.
[profile.dev.package."sha2@0.10.9"]
opt-level = 3
