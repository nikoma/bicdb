[package]
name = "bicdb-cell"
version = "1.0.619"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cell construction boundary of the BicDB database. Part of BicDB, one database for SQL (PostgreSQL protocol), a Redis-compatible cache, search and vectors; install `bicdb`"
readme = "README.md"
keywords = ["bicdb", "database"]
categories = ["database-implementations"]
# Build inputs only: test suites, fixtures and examples stay in the repository.
include = ["/README.md", "/src/**", "/Cargo.toml", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md"]

[[bin]]
name = "bicdb-cell"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bicdb-app-runtime = { path = "../bicdb-app-runtime", version = "=1.0.619" }
bicdb-cell-admission = { path = "../bicdb-cell-admission", version = "=1.0.619" }
bicdb-cell-ha = { path = "../bicdb-cell-ha", version = "=1.0.619" }
bicdb-cell-device = { path = "../bicdb-cell-device", version = "=1.0.619" }
bicdb-cell-grant = { path = "../bicdb-cell-grant", version = "=1.0.619" }
bicdb-core = { path = "../bicdb-core", version = "=1.0.619", default-features = false, features = ["compression"] }
bicdb-extension = { path = "../bicdb-extension", version = "=1.0.619" }
bicdb-fleet = { path = "../bicdb-fleet", version = "=1.0.619" }
ciborium.workspace = true
clap.workspace = true
ctrlc.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
hkdf.workspace = true
hmac.workspace = true
libc.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
wat = "1"
