[package]
name = "bicdb-pgwire"
version = "1.0.548"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PostgreSQL wire-protocol server of the BicDB database. Part of BicDB, one database for SQL (PostgreSQL protocol), a Redis-compatible cache, search and vectors; install `bicdb`"
readme = "README.md"
keywords = ["bicdb", "database"]
categories = ["database-implementations"]
# Build inputs only: test suites, fixtures and examples stay in the repository.
include = ["/README.md", "/src/**", "/Cargo.toml", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md"]

[features]
default = ["bicdb-sql/default"]

[dependencies]
futures-core = "0.3"
lapin = { version = "4.12", default-features = false, features = ["tokio", "rustls--ring", "rustls-webpki-roots-certs"] }
redis.workspace = true
axum.workspace = true
axum-server.workspace = true
argon2.workspace = true
base64.workspace = true
bicdb-core = { path = "../bicdb-core", version = "=1.0.548" }
bicdb-sql = { path = "../bicdb-sql", version = "=1.0.548", default-features = false }
ctrlc.workspace = true
hex.workspace = true
hmac.workspace = true
libc.workspace = true
parking_lot.workspace = true
pbkdf2.workspace = true
rustc-hash.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlparser.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

x509-parser.workspace = true

[dev-dependencies]
bicdb-page = { path = "../bicdb-page", version = "=1.0.548" }
futures-util = "0.3"
openssl = "0.10"
postgres-openssl = "0.5.3"
serde_json.workspace = true
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "postgres"] }
tempfile.workspace = true
tokio.workspace = true
tokio-postgres = "0.7.18"
uuid.workspace = true
