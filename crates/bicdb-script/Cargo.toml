[package]
name = "bicdb-script"
version = "1.0.653"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bounded JavaScript execution and TypeScript compilation for BicDB workflows. Part of BicDB, one database for SQL (PostgreSQL protocol), a Redis-compatible cache, search and vectors; install `bicdb`"
readme = "README.md"
keywords = ["bicdb", "database"]
categories = ["database-implementations"]
# Build inputs only: test suites, fixtures and examples stay in the repository.
include = ["/README.md", "/src/**", "/Cargo.toml", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md"]

[dependencies]
oxc_allocator = "=0.152.0"
oxc_codegen = "=0.152.0"
oxc_parser = "=0.152.0"
oxc_semantic = "=0.152.0"
oxc_span = "=0.152.0"
oxc_transformer = "=0.152.0"
rquickjs = "0.14"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
